name: "DAST - OWASP ZAP Baseline Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 3 * * 1' # Runs at 03:30 UTC every Monday

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the application
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'api360/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ./api360

      - name: Build the Vite production bundle
        run: npm run build
        working-directory: ./api360

      - name: Start production preview server
        run: npx vite preview --port 5173 &
        working-directory: ./api360
        env:
          PORT: 5173

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:5173
        working-directory: ./api360

      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:5173'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false

      - name: Upload Report
        if: always() # Always upload the report even if ZAP finds issues and fails the step
        uses: actions/upload-artifact@v4
        with:
          name: ZAP-Report
          path: report_html.html
