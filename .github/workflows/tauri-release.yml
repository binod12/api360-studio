name: Release API360
on:
  workflow_run:
    workflows: ["Security Validation Suite"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './packages/app/package-lock.json'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Frontend Dependencies
        working-directory: ./packages/app
        run: npm install --legacy-peer-deps

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './packages/app'
          tagName: ${{ github.event.inputs.tag_name || github.ref_name || github.run_id }}
          releaseName: 'API360 Studio ${{ github.event.inputs.tag_name || github.ref_name || github.run_id }}'
          releaseBody: 'See the attached assets to download API360 for your operating system. Use the portable ZIP files if you cannot use the installers.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          
      - name: Create Portable Windows ZIP
        if: matrix.platform == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force -Path api360-portable
          Copy-Item -Path "packages/app/src-tauri/target/release/app.exe" -Destination "api360-portable/api360.exe"
          Compress-Archive -Path "api360-portable/*" -DestinationPath api360-windows-portable.zip
          
      - name: Create Portable Mac ZIP (Apple Silicon)
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'aarch64')
        run: |
          cd packages/app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          zip -r ../../../../../../../../api360-mac-apple-silicon-portable.zip "api360.app"
          
      - name: Create Portable Mac ZIP (Intel)
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'x86_64')
        run: |
          cd packages/app/src-tauri/target/x86_64-apple-darwin/release/bundle/macos
          zip -r ../../../../../../../../api360-mac-intel-portable.zip "api360.app"

      - name: Upload Portable Releases (Windows)
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name || github.run_id }}
        run: gh release upload "$RELEASE_TAG" api360-windows-portable.zip --clobber

      - name: Upload Portable Releases (Mac Silicon)
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'aarch64')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name || github.run_id }}
        run: gh release upload "$RELEASE_TAG" api360-mac-apple-silicon-portable.zip --clobber

      - name: Upload Portable Releases (Mac Intel)
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'x86_64')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name || github.run_id }}
        run: gh release upload "$RELEASE_TAG" api360-mac-intel-portable.zip --clobber
