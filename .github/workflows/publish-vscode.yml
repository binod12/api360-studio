name: Publish VS Code Extension

on:
  workflow_run:
    workflows: ["SAST - Semgrep Static Analysis", "DAST - OWASP ZAP Baseline Scan"]
    types:
      - completed
    branches:
      - main

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React Webview
        working-directory: ./api360
        run: |
          npm ci
          BUILD_TARGET=vscode npm run build

      - name: Install Extension Backend
        working-directory: ./api360-vscode
        run: |
          npm ci

      - name: Publish to VS Code Marketplace
        working-directory: ./api360-vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish
