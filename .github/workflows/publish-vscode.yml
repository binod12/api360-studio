name: Publish VS Code Extension

on:
  workflow_run:
    workflows: ["Security Validation Suite"]
    types:
      - completed
    branches:
      - main

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React Webview
        working-directory: ./packages/app
        run: |
          npm ci --legacy-peer-deps
          BUILD_TARGET=vscode npm run build

      - name: Install Extension Backend
        working-directory: ./packages/vscode
        run: |
          npm ci

      - name: Publish to VS Code Marketplace
        working-directory: ./packages/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MAJOR_MINOR=$(echo $VERSION | cut -d. -f1,2)
          PATCH_NUM=$(( ${{ github.run_number }} + 100 ))
          NEW_VERSION="$MAJOR_MINOR.$PATCH_NUM"
          echo "Automated version bump: $VERSION -> $NEW_VERSION"
          npm version $NEW_VERSION --no-git-tag-version --allow-same-version
          npx @vscode/vsce publish
