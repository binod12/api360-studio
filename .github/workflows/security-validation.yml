name: "Security Validation Suite"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 2 * * 1' # Runs at 02:30 UTC every Monday

jobs:
  sast:
    name: SAST - Semgrep Code Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep ci
        env:
          SEMGREP_RULES: p/default

  dast:
    name: DAST - OWASP ZAP Dynamic Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'api360/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ./api360

      - name: Build the Vite production bundle
        run: npm run build
        working-directory: ./api360

      - name: Start production preview server
        run: npx vite preview --port 5173 &
        working-directory: ./api360
        env:
          PORT: 5173

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:5173
        working-directory: ./api360

      - name: Grant ZAP Container Write Permissions
        run: chmod -R 777 .

      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:5173'
          cmd_options: '-a'
          allow_issue_writing: false

      - name: Upload Report
        if: always() # Always upload the report even if ZAP finds issues and fails the step
        uses: actions/upload-artifact@v4
        with:
          name: ZAP-Report
          path: report_html.html
